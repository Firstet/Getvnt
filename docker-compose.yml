version: '3.8'

services:
  # 1. Nginx Unified Frontend Gateway
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.getvnt-route.rule=PathPrefix(`/`)"
      - "traefik.http.routers.getvnt-route.entrypoints=web"
      - "traefik.http.routers.getvnt-route.service=getvnt-service"
      - "traefik.http.services.getvnt-service.loadbalancer.server.port=80"
    depends_on:
      - api
    restart: always

  # 2. Laravel API Backend (Port 8000 internal)
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://169.58.142.29"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos_user
      DB_PASSWORD: secret_password
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    restart: always

  # 3. MySQL Production Database
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: eventos
      MYSQL_USER: eventos_user
      MYSQL_PASSWORD: secret_password
    volumes:
      - dbdata:/var/lib/mysql
    restart: always

  # 4. Redis Cache & Queue Broker
  redis:
    image: redis:alpine
    restart: always

networks:
  dokploy-network:
    external: true

volumes:
  dbdata:
