version: '3.8'

services:
  # 1. Nginx Unified Frontend Gateway
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-getvnt.com}
      WORKSPACE_DOMAIN: ${WORKSPACE_DOMAIN:-app.getvnt.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.getvnt.com}
      API_DOMAIN: ${API_DOMAIN:-api.getvnt.com}
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # HTTP Router (Port 80)
      - "traefik.http.routers.getvnt-http.rule=Host(`getvnt.com`) || Host(`app.getvnt.com`) || Host(`admin.getvnt.com`) || Host(`api.getvnt.com`) || PathPrefix(`/`)"
      - "traefik.http.routers.getvnt-http.entrypoints=web"
      - "traefik.http.routers.getvnt-http.service=getvnt-service"
      # HTTPS Router (Port 443 with Let's Encrypt SSL)
      - "traefik.http.routers.getvnt-https.rule=Host(`getvnt.com`) || Host(`app.getvnt.com`) || Host(`admin.getvnt.com`) || Host(`api.getvnt.com`)"
      - "traefik.http.routers.getvnt-https.entrypoints=websecure"
      - "traefik.http.routers.getvnt-https.tls=true"
      - "traefik.http.routers.getvnt-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.getvnt-https.service=getvnt-service"
      - "traefik.http.services.getvnt-service.loadbalancer.server.port=80"
    depends_on:
      - api
    restart: always

  # 2. Laravel API Backend (Port 8000 internal)
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://getvnt.com}"
      FRONTEND_URL: "${FRONTEND_URL:-https://getvnt.com}"
      WORKSPACE_URL: "${WORKSPACE_URL:-https://app.getvnt.com}"
      ADMIN_URL: "${ADMIN_URL:-https://admin.getvnt.com}"
      API_URL: "${API_URL:-https://api.getvnt.com}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-getvnt.com,www.getvnt.com,app.getvnt.com,admin.getvnt.com,api.getvnt.com}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-.getvnt.com}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://getvnt.com,https://www.getvnt.com,https://app.getvnt.com,https://admin.getvnt.com,https://api.getvnt.com}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 3. MySQL Production Database
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      MYSQL_USER: "${MYSQL_USER:?MYSQL_USER is required}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 4. Redis Cache & Queue Broker
  redis:
    image: redis:alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  dokploy-network:
    external: true

volumes:
  dbdata:
