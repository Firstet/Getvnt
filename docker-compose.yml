version: '3.8'

services:
  # 1. Nginx Unified Frontend Gateway
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-getvnt.com}
      WORKSPACE_DOMAIN: ${WORKSPACE_DOMAIN:-app.getvnt.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.getvnt.com}
      API_DOMAIN: ${API_DOMAIN:-api.getvnt.com}
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.getvnt-route.rule=HostRegexp(`{subdomain:.*}.getvnt.com`) || Host(`getvnt.com`) || PathPrefix(`/`)"
      - "traefik.http.routers.getvnt-route.entrypoints=web"
      - "traefik.http.routers.getvnt-route.service=getvnt-service"
      - "traefik.http.services.getvnt-service.loadbalancer.server.port=80"
    depends_on:
      - api
    restart: always

  # 2. Laravel API Backend (Port 8000 internal)
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://getvnt.com}"
      FRONTEND_URL: "${FRONTEND_URL:-https://getvnt.com}"
      WORKSPACE_URL: "${WORKSPACE_URL:-https://app.getvnt.com}"
      ADMIN_URL: "${ADMIN_URL:-https://admin.getvnt.com}"
      API_URL: "${API_URL:-https://api.getvnt.com}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-getvnt.com,www.getvnt.com,app.getvnt.com,admin.getvnt.com,api.getvnt.com,169.58.142.29}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-.getvnt.com}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://getvnt.com,https://www.getvnt.com,https://app.getvnt.com,https://admin.getvnt.com,https://api.getvnt.com,http://169.58.142.29,http://169.58.142.29:8080}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos_user
      DB_PASSWORD: secret_password
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    restart: always

  # 3. MySQL Production Database
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: eventos
      MYSQL_USER: eventos_user
      MYSQL_PASSWORD: secret_password
    volumes:
      - dbdata:/var/lib/mysql
    restart: always

  # 4. Redis Cache & Queue Broker
  redis:
    image: redis:alpine
    restart: always

networks:
  dokploy-network:
    external: true

volumes:
  dbdata:
